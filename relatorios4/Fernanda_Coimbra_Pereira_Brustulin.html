      const value = Number(score);
      if (!Number.isFinite(value) || value <= 0) {
        return { label: "Inexistente", color: "#8f8f8f" };
      }
      if (value <= 2) {
        return { label: "Crítico", color: "#ef5b48" };
      }
      if (value <= 4) {
        return { label: "Fraco", color: "#f09a3d" };
      }
      if (value <= 6) {
        return { label: "Regular", color: "#d8b928" };
      }
      if (value <= 8) {
        return { label: "Bom", color: "#54c96f" };
      }
      return { label: "Referência", color: "#0fbf72" };
    }

    function renderDiagnosisAxisTable(field) {
      const pageData = REPORT_DATA.paginas && REPORT_DATA.paginas.diagnostico;
      const axes = ((pageData && pageData.radarEixos && pageData.radarEixos.eixos) || []).filter(Boolean);
      const rows = axes.map((axis) => {
        const axisName = axis.nome || "";
        const isQualitativeAxis = axisName === "Prontidão para IA";
        if (isQualitativeAxis) {
          return `
          <tr>
            <td class="diagnosis-axis-name">${escapeHtml(axisName)}</td>
            <td class="diagnosis-axis-status-cell" colspan="2"><span class="diagnosis-axis-status diagnosis-axis-no-score">EIXO SEM NOTA</span></td>
          </tr>
        `;
        }

        const score = axis.nota !== undefined && axis.nota !== null && axis.nota !== "" ? axis.nota : 0;
        const status = getDiagnosisScoreStatus(score);
        return `
          <tr>
            <td class="diagnosis-axis-name">${escapeHtml(axisName)}</td>
            <td class="diagnosis-axis-score">${escapeHtml(score)}</td>
            <td class="diagnosis-axis-status-cell"><span class="diagnosis-axis-status" style="background-color: ${status.color}">${escapeHtml(status.label)}</span></td>
          </tr>
        `;
      }).join("");

      field.innerHTML = `
        <div class="diagnosis-axis-table-title">Notas por eixo</div>
        <table class="diagnosis-axis-table" aria-label="Notas por eixo">
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function normalizeDiagnosisAction(action, index) {
      if (action && typeof action === "object") {
        return {
          titulo: action.titulo || "Ação " + (index + 1),
          motivo: action.motivo || action.texto || ""
        };
      }

      return {
        titulo: "Ação " + (index + 1),
        motivo: action || ""
      };
    }

    function renderDiagnosisActions(field) {
      const pageData = REPORT_DATA.paginas && REPORT_DATA.paginas.diagnostico;
      const sourceActions = Array.isArray(pageData && pageData.acoesAgora) ? pageData.acoesAgora : [];
      const fallbackActions = [
        { titulo: "Padronizar informações", motivo: "Padronizar nome, especialidade, cidade, região de atendimento, telefone, WhatsApp, links principais e descrições em todos os pontos onde o paciente confirma as informações antes de decidir entrar em contato." },
        { titulo: "Reforçar clareza", motivo: "Reforçar as informações que ajudam o paciente a entender a atuação, os diferenciais, os temas tratados, o tipo de consulta e o caminho recomendado antes de enviar uma mensagem ou agendar atendimento." },
        { titulo: "Priorizar impacto", motivo: "Priorizar os canais com maior impacto na descoberta e na confiança do consultório, começando pelos ajustes que melhoram busca local, clareza de contato, consistência entre plataformas e percepção profissional." }
      ];
      const actions = (sourceActions.length > 0 ? sourceActions : fallbackActions).slice(0, 3).map(normalizeDiagnosisAction);
      const items = actions.map((action, index) => `
        <li><span class="diagnosis-actions-number">${index + 1}</span><span class="diagnosis-actions-content"><span class="diagnosis-actions-card-title">${escapeHtml(action.titulo)}</span><span class="diagnosis-actions-text">${renderInlineMarkdown(action.motivo)}</span></span></li>
      `).join("");

      field.innerHTML = `
        <div class="diagnosis-actions-shell">
          <div class="diagnosis-actions-title">Se você for mexer em três coisas</div>
          <ul class="diagnosis-actions-list">${items}</ul>
        </div>
      `;
    }

    function fitDiagnosisActionsBlock(scope = document) {
      const field = scope.querySelector && scope.querySelector(".field-diagnostico-acoes");
      if (!field) return;

      const cards = Array.from(field.querySelectorAll(".diagnosis-actions-list li"));
      const texts = Array.from(field.querySelectorAll(".diagnosis-actions-text"));
      if (cards.length === 0 || texts.length === 0) return;

      const initialTop = 60.2;
      const initialHeight = 30.8;
      const minTop = 56.8;
      const maxHeight = 34.2;
      const maxFontSize = 10;
      const minFontSize = 8;

      function applyLayout(top, height, fontSize) {
        field.style.top = top + "%";
        field.style.height = height + "%";
        texts.forEach((text) => {
          text.style.fontSize = fontSize + "pt";
        });
      }

      function overflows() {
        return cards.some((card) => card.scrollHeight > card.clientHeight + 1 || card.scrollWidth > card.clientWidth + 1);
      }

      applyLayout(initialTop, initialHeight, maxFontSize);
      if (!overflows()) return;

      for (let i = 1; i <= 12; i += 1) {
        const progress = i / 12;
        const top = initialTop - ((initialTop - minTop) * progress);
        const height = initialHeight + ((maxHeight - initialHeight) * progress);
        applyLayout(top, height, maxFontSize);
        if (!overflows()) return;
      }

      let low = minFontSize;
      let high = maxFontSize;
      let best = minFontSize;
      for (let i = 0; i < 18; i += 1) {
        const mid = (low + high) / 2;
        applyLayout(minTop, maxHeight, mid);
        if (overflows()) {
          high = mid;
        } else {
          best = mid;
          low = mid;
        }
      }
      applyLayout(minTop, maxHeight, best);
    }
    function renderRadarChart(field, config) {
      const values = (config && config.eixos) || [];
      const maxValue = (config && config.escalaMaxima) || 10;
      const visualOffset = 1.5;
      const visualMaxValue = maxValue + visualOffset;
      const centerX = 300;
      const centerY = 287;
      const radius = 205;
      const labelOffset = 34;
      const count = values.length || 1;
      const startAngle = -Math.PI / 2;

      const axes = values.map((item, index) => {
        const angle = startAngle + (Math.PI * 2 * index) / count;
        const end = polarPoint(centerX, centerY, radius, angle);
        const scoreValue = Math.round(Number(item.nota) || 0);
        const visualValue = Math.max(0, Math.min(scoreValue, maxValue)) + visualOffset;
        const score = polarPoint(centerX, centerY, radius * visualValue / visualMaxValue, angle);
        const label = polarPoint(score.x, score.y, labelOffset, angle);
        return { item: { ...item, nota: scoreValue }, angle, end, label, pill: score, score };
      });

            const maxShadowPoints = axes.map(({ angle }) => polarPoint(centerX, centerY, radius * (maxValue + visualOffset) / visualMaxValue, angle));
            const maxShadow = `<polygon class="radar-max-shadow" points="${svgPolygon(maxShadowPoints)}"></polygon>`;
      const maxRays = maxShadowPoints.map((point) => `<line class="radar-max-ray" x1="${centerX}" y1="${centerY}" x2="${point.x.toFixed(2)}" y2="${point.y.toFixed(2)}"></line>`).join("");
      const areaPoints = axes.map(({ score }) => score);
      const area = `<polygon class="radar-area" points="${svgPolygon(areaPoints)}"></polygon>`;
      const labels = axes.map(({ item, label, score }) => {
        const anchor = score.x < centerX - 8 ? "end" : score.x > centerX + 8 ? "start" : "middle";
        return `<text class="radar-label" x="${label.x.toFixed(2)}" y="${label.y.toFixed(2)}" text-anchor="${anchor}" dominant-baseline="middle">${escapeHtml(item.nome)}</text>`;
      }).join("");
      const scorePills = axes.map(({ item, pill }) => `
        <g>
          <rect class="radar-score-pill" x="${(pill.x - 15).toFixed(2)}" y="${(pill.y - 12).toFixed(2)}" width="30" height="24" rx="12"></rect>
          <text class="radar-score-text" x="${pill.x.toFixed(2)}" y="${(pill.y + 1).toFixed(2)}" text-anchor="middle" dominant-baseline="middle">${item.nota}</text>
        </g>`).join("");

                  field.innerHTML = `<div class="radar-box-title">RADAR DA PRESENÇA DIGITAL</div>
      <svg class="radar-chart" viewBox="0 0 600 530" role="img" aria-label="Grafico radar dos eixos">
${maxShadow}${maxRays}${area}${scorePills}${labels}
      </svg>`;
    }
    function pageUsesLightFooter(pageConfig) {
      return pageConfig.footerTheme === "light" || /preto|black|dark/i.test(pageConfig.file || "");
    }
    function updatePageNumbers() {
      const pages = Array.from(document.querySelectorAll(".page"));
      const totalPages = pages.length;
      pages.forEach((page, index) => {
        const pageNumber = page.querySelector(".page-number");
        if (pageNumber) {
          pageNumber.textContent = String(index + 1) + "/" + String(totalPages);
        }
      });
    }
    function renderReport() {
      const report = document.getElementById("report");
      document.body.classList.remove("debug-boxes");
      report.innerHTML = "";
      const pageFileCounts = {};

      function renderPageInstance(pageConfig, options = {}) {
        const page = document.createElement("section");
        page.className = "page";
        if (pageUsesLightFooter(pageConfig)) {
          page.classList.add("page-footer-light");
        }
        page.dataset.page = pageConfig.id;

        const debugPageName = pageConfig.debugName || pageConfig.id;
        pageFileCounts[debugPageName] = (pageFileCounts[debugPageName] || 0) + 1;
        const pageLabel = document.createElement("div");
        pageLabel.className = "debug-page-label";
        pageLabel.textContent = pageFileCounts[debugPageName] > 1 ? debugPageName + " #" + pageFileCounts[debugPageName] : debugPageName;
        page.appendChild(pageLabel);

        if (pageConfig.id !== "capa" && !pageConfig.hideFooter) {
          const footerLine = document.createElement("div");
          footerLine.className = "page-footer-line";
          page.appendChild(footerLine);

          const pageNumber = document.createElement("div");
          pageNumber.className = "page-number";
          pageNumber.dataset.pageNumber = "true";
          page.appendChild(pageNumber);
        }

        const bg = document.createElement("img");
        bg.className = "page-bg";
        bg.src = ASSETS.pagesBasePath + pageConfig.file;
        bg.alt = "";
        page.appendChild(bg);

        const fieldsToFit = [];
        const recommendationFieldsToTrim = [];
        const flowGroups = {};
        const debugLabelPairs = [];

        pageConfig.fields.forEach((fieldConfig) => {
          const field = document.createElement("div");
          field.className = "field " + fieldConfig.className;
          field.dataset.field = fieldConfig.id;
          field.dataset.debugIndex = String(pageConfig.fields.indexOf(fieldConfig) + 1);

          const debugFieldLabel = document.createElement("span");
          debugFieldLabel.className = "debug-field-label";
          debugFieldLabel.textContent = "Box " + field.dataset.debugIndex + " - " + fieldConfig.id;
          page.appendChild(debugFieldLabel);
          debugLabelPairs.push({ field, label: debugFieldLabel });

          const fieldValue = getFieldValue(pageConfig.id, fieldConfig.id);
          if (fieldConfig.type === "action-plan") {
            renderActionPlan(field, fieldValue);
          } else if (fieldConfig.type === "methodology-page") {
            renderMethodologyPage(field, REPORT_DATA.paginas && REPORT_DATA.paginas[pageConfig.id]);
          } else if (fieldConfig.type === "markdown" || fieldConfig.type === "markdown-fit-text") {
            setFieldHtml(field, renderBasicMarkdown(fieldValue));
          } else if (fieldConfig.type === "radar-chart") {
            renderRadarChart(field, fieldValue);
          } else if (fieldConfig.type === "average-score") {
            renderAverageScore(field, pageConfig.id);
          } else if (fieldConfig.type === "diagnosis-axis-table") {
            renderDiagnosisAxisTable(field);
          } else if (fieldConfig.type === "diagnosis-actions") {
            renderDiagnosisActions(field);
          } else if (fieldConfig.type === "axis-score") {
            renderAxisScore(field, pageConfig.id);
          } else if (fieldConfig.type === "axis-recommendations") {
            renderAxisRecommendations(field, pageConfig.id);
          } else if (fieldConfig.type === "axis-qualitative-note") {
            field.textContent = "Prontidão para IA não recebe nota porque respostas de inteligência artificial variam conforme ferramenta, pergunta, fontes disponíveis e momento da busca.";
          } else if (fieldConfig.type === "axis-page-link") {
            if (renderAxisPageLink(field, pageConfig.id) === false) {
              return;
            }
          } else if (fieldConfig.type === "flow-text") {
            field.dataset.flowSource = "true";
          } else if (fieldConfig.type === "flow-target") {
            field.dataset.flowTarget = "true";
          } else {
            field.appendChild(document.createTextNode(fieldValue));
          }

          page.appendChild(field);
          if (field.dataset.axisPageLinkVisible === "true") {
            page.classList.add("has-axis-page-link");
          }

          if (fieldConfig.type === "fit-text" || fieldConfig.type === "markdown-fit-text") {
            fieldsToFit.push(field);
          }

          if (fieldConfig.type === "axis-recommendations") {
            recommendationFieldsToTrim.push(field);
          }

          if (fieldConfig.flowGroup) {
            if (!flowGroups[fieldConfig.flowGroup]) {
              flowGroups[fieldConfig.flowGroup] = { sourceText: "", fields: [] };
            }

            if (fieldConfig.type === "flow-text") {
              flowGroups[fieldConfig.flowGroup].sourceText = fieldValue;
            }

            flowGroups[fieldConfig.flowGroup].fields.push(field);
          }
        });

        report.appendChild(page);
        debugLabelPairs.forEach(({ field, label }) => positionDebugFieldLabel(field, label));

        const flowResultByGroup = {};
        withDebugLabelsHidden(() => {
          Object.keys(flowGroups).forEach((groupId) => {
            applyFlowTypography(flowGroups[groupId].fields, Boolean(options.compactFlow));
            flowResultByGroup[groupId] = renderFlowText(
              flowGroups[groupId].sourceText,
              flowGroups[groupId].fields,
              (options.flowStartByGroup && options.flowStartByGroup[groupId]) || 0
            );
          });
          fieldsToFit.forEach(fitTextToBox);
          adjustAxisPageLayout(page);
          fitAxisTextToBox(page.querySelector(".field-eixo-texto"));
          fitDiagnosisActionsBlock(page);
          recommendationFieldsToTrim.forEach(trimOverflowingAxisRecommendations);
          debugLabelPairs.forEach(({ field, label }) => positionDebugFieldLabel(field, label));
        });

        return { page, flowResultByGroup };
      }

      ASSETS.pages.forEach((pageConfig) => {
        let result = renderPageInstance(pageConfig, { compactFlow: false });
        const overflowingGroups = Object.keys(result.flowResultByGroup).filter((groupId) => result.flowResultByGroup[groupId].hasOverflow);

        if (overflowingGroups.length > 0 && pageConfig.allowFlowRepeat) {
          result.page.remove();
          pageFileCounts[pageConfig.debugName || pageConfig.id] -= 1;
          const compactResult = renderPageInstance(pageConfig, { compactFlow: true });
          const compactStillOverflows = Object.keys(compactResult.flowResultByGroup).some((groupId) => compactResult.flowResultByGroup[groupId].hasOverflow);

          if (compactStillOverflows) {
            compactResult.page.remove();
            pageFileCounts[pageConfig.debugName || pageConfig.id] -= 1;
            result = renderPageInstance(pageConfig, { compactFlow: false });
          } else {
            result = compactResult;
          }
        }

        let continuationStarts = {};
        Object.keys(result.flowResultByGroup).forEach((groupId) => {
          if (result.flowResultByGroup[groupId].hasOverflow) {
            continuationStarts[groupId] = result.flowResultByGroup[groupId].nextIndex;
          }
        });

        let guard = 0;
        while (pageConfig.allowFlowRepeat && Object.keys(continuationStarts).length > 0 && guard < 20) {
          guard += 1;
          const continuation = renderPageInstance(pageConfig, {
            compactFlow: false,
            flowStartByGroup: continuationStarts
          });

          const nextStarts = {};
          Object.keys(continuation.flowResultByGroup).forEach((groupId) => {
            if (continuation.flowResultByGroup[groupId].hasOverflow) {
              nextStarts[groupId] = continuation.flowResultByGroup[groupId].nextIndex;
            }
          });
          continuationStarts = nextStarts;
        }
      });

      updatePageNumbers();
      document.body.classList.toggle("debug-boxes", Boolean(ASSETS.showDebugBoxes));
    }
    function recalculateAxisLayouts() {
      fitActionPlanText(document);
      document.querySelectorAll(".page").forEach((page) => {
        adjustAxisPageLayout(page);
        fitAxisTextToBox(page.querySelector(".field-eixo-texto"));
        fitDiagnosisActionsBlock(page);
        page.querySelectorAll(".field-eixo-recomendacoes").forEach(trimOverflowingAxisRecommendations);
      });
    }

    function validateNoParagraphSeparatorLeak() {
      const report = document.getElementById("report");
      if (!report) return true;

      const separatorPattern = /\\r\\n|\\n\\n|\\n|\\r/g;

      function leakedTextNodes() {
        const nodes = [];
        const walker = document.createTreeWalker(report, NodeFilter.SHOW_TEXT);
        let node;

        while ((node = walker.nextNode())) {
          const text = node.nodeValue || "";
          if (separatorPattern.test(text)) {
            nodes.push(node);
          }
          separatorPattern.lastIndex = 0;
        }

        return nodes;
      }

      function appendTextWithLineBreaks(fragment, text) {
        text.split(/\n/).forEach((line, index) => {
          if (index > 0) {
            fragment.appendChild(document.createElement("br"));
          }
          fragment.appendChild(document.createTextNode(line));
        });
      }

      function replaceTextNodeWithParagraphBreaks(node) {
        const text = normalizeMarkdownBreaks(node.nodeValue || "");
        const paragraphs = text
          .split(/\n{2,}/)
          .map((paragraph) => paragraph.trim())
          .filter(Boolean);

        if (paragraphs.length === 0) {
          node.nodeValue = "";
          return;
        }

        const parent = node.parentElement;
        if (parent && parent.tagName === "P" && parent.childNodes.length === 1) {
          const fragment = document.createDocumentFragment();
          paragraphs.forEach((paragraph) => {
            const p = document.createElement("p");
            appendTextWithLineBreaks(p, paragraph);
            fragment.appendChild(p);
          });
          parent.replaceWith(fragment);
          return;
        }

        const fragment = document.createDocumentFragment();
        paragraphs.forEach((paragraph, index) => {
          if (index > 0) {
            fragment.appendChild(document.createElement("br"));
            fragment.appendChild(document.createElement("br"));
          }
          appendTextWithLineBreaks(fragment, paragraph);
        });
        node.replaceWith(fragment);
      }

      const leakedNodes = leakedTextNodes();
      leakedNodes.forEach(replaceTextNodeWithParagraphBreaks);

      const remainingLeaks = leakedTextNodes();
      document.body.dataset.separatorLeak = remainingLeaks.length > 0 ? "true" : "false";

      if (remainingLeaks.length > 0) {
        console.error("Separador de parágrafo ainda vazou após reparo automático.", remainingLeaks.map((node) => node.nodeValue));
        return false;
      }

      return true;
    }

    function recalculateAndValidateReport() {
      recalculateAxisLayouts();
      validateNoParagraphSeparatorLeak();
    }
    renderReport();
    requestAnimationFrame(() => requestAnimationFrame(recalculateAndValidateReport));
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => requestAnimationFrame(recalculateAndValidateReport));
    }
    window.addEventListener("load", () => requestAnimationFrame(recalculateAndValidateReport));
  </script>
</body>
