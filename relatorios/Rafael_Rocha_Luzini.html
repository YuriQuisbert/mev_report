          textoPrincipal: `**A presença digital passou a fazer parte da decisão de quem procura atendimento médico.** Mesmo quando existe uma indicação, é comum que o paciente pesquise o nome, confirme a especialidade, verifique a região de atendimento e procure informações que transmitam segurança antes de entrar em contato.

Quando essa busca começa pela especialidade, o desafio é ainda maior: **ser encontrado por quem ainda não conhece o médico.** Por isso, uma presença digital forte precisa cumprir duas funções ao mesmo tempo: confirmar a identidade de quem já recebeu uma indicação e facilitar a descoberta por novos pacientes.

          } else if (fieldConfig.type === "average-score") {
            renderAverageScore(field, pageConfig.id);
          } else if (fieldConfig.type === "axis-score") {
            renderAxisScore(field, pageConfig.id);
          } else if (fieldConfig.type === "axis-recommendations") {
            renderAxisRecommendations(field, pageConfig.id);
          } else if (fieldConfig.type === "flow-text") {
            field.dataset.flowSource = "true";
          } else if (fieldConfig.type === "flow-target") {
            field.dataset.flowTarget = "true";
          } else {
            field.appendChild(document.createTextNode(fieldValue));
          }

          page.appendChild(field);

          if (fieldConfig.type === "fit-text" || fieldConfig.type === "markdown-fit-text") {
            fieldsToFit.push(field);
          }

          if (fieldConfig.type === "axis-recommendations") {
            recommendationFieldsToTrim.push(field);
          }

          if (fieldConfig.flowGroup) {
            if (!flowGroups[fieldConfig.flowGroup]) {
              flowGroups[fieldConfig.flowGroup] = { sourceText: "", fields: [] };
            }

            if (fieldConfig.type === "flow-text") {
              flowGroups[fieldConfig.flowGroup].sourceText = fieldValue;
            }

            flowGroups[fieldConfig.flowGroup].fields.push(field);
          }
        });

        report.appendChild(page);
        debugLabelPairs.forEach(({ field, label }) => positionDebugFieldLabel(field, label));

        const flowResultByGroup = {};
        withDebugLabelsHidden(() => {
          Object.keys(flowGroups).forEach((groupId) => {
            applyFlowTypography(flowGroups[groupId].fields, Boolean(options.compactFlow));
            flowResultByGroup[groupId] = renderFlowText(
              flowGroups[groupId].sourceText,
              flowGroups[groupId].fields,
              (options.flowStartByGroup && options.flowStartByGroup[groupId]) || 0
            );
          });
          fieldsToFit.forEach(fitTextToBox);
          adjustAxisPageLayout(page);
          fitAxisTextToBox(page.querySelector(".field-eixo-texto"));
          recommendationFieldsToTrim.forEach(trimOverflowingAxisRecommendations);
          debugLabelPairs.forEach(({ field, label }) => positionDebugFieldLabel(field, label));
        });

        return { page, flowResultByGroup };
      }

      ASSETS.pages.forEach((pageConfig) => {
        let result = renderPageInstance(pageConfig, { compactFlow: false });
        const overflowingGroups = Object.keys(result.flowResultByGroup).filter((groupId) => result.flowResultByGroup[groupId].hasOverflow);

        if (overflowingGroups.length > 0 && pageConfig.allowFlowRepeat) {
          result.page.remove();
          pageFileCounts[pageConfig.file] -= 1;
          const compactResult = renderPageInstance(pageConfig, { compactFlow: true });
          const compactStillOverflows = Object.keys(compactResult.flowResultByGroup).some((groupId) => compactResult.flowResultByGroup[groupId].hasOverflow);

          if (compactStillOverflows) {
            compactResult.page.remove();
            pageFileCounts[pageConfig.file] -= 1;
            result = renderPageInstance(pageConfig, { compactFlow: false });
          } else {
            result = compactResult;
          }
        }

        let continuationStarts = {};
        Object.keys(result.flowResultByGroup).forEach((groupId) => {
          if (result.flowResultByGroup[groupId].hasOverflow) {
            continuationStarts[groupId] = result.flowResultByGroup[groupId].nextIndex;
          }
        });

        let guard = 0;
        while (pageConfig.allowFlowRepeat && Object.keys(continuationStarts).length > 0 && guard < 20) {
          guard += 1;
          const continuation = renderPageInstance(pageConfig, {
            compactFlow: false,
            flowStartByGroup: continuationStarts
          });

          const nextStarts = {};
          Object.keys(continuation.flowResultByGroup).forEach((groupId) => {
            if (continuation.flowResultByGroup[groupId].hasOverflow) {
              nextStarts[groupId] = continuation.flowResultByGroup[groupId].nextIndex;
            }
          });
          continuationStarts = nextStarts;
        }
      });

      updatePageNumbers();
      document.body.classList.toggle("debug-boxes", Boolean(ASSETS.showDebugBoxes));
    }
    function recalculateAxisLayouts() {
      fitActionPlanText(document);
      document.querySelectorAll(".page").forEach((page) => {
        adjustAxisPageLayout(page);
        fitAxisTextToBox(page.querySelector(".field-eixo-texto"));
        page.querySelectorAll(".field-eixo-recomendacoes").forEach(trimOverflowingAxisRecommendations);
      });
    }

    function validateNoParagraphSeparatorLeak() {
      const report = document.getElementById("report");
      if (!report) return true;

      const separatorPattern = /\\r\\n|\\n\\n|\\n|\\r/g;

      function leakedTextNodes() {
        const nodes = [];
        const walker = document.createTreeWalker(report, NodeFilter.SHOW_TEXT);
        let node;

        while ((node = walker.nextNode())) {
          const text = node.nodeValue || "";
          if (separatorPattern.test(text)) {
            nodes.push(node);
          }
          separatorPattern.lastIndex = 0;
        }

        return nodes;
      }

      function appendTextWithLineBreaks(fragment, text) {
        text.split(/\n/).forEach((line, index) => {
          if (index > 0) {
            fragment.appendChild(document.createElement("br"));
          }
          fragment.appendChild(document.createTextNode(line));
        });
      }

      function replaceTextNodeWithParagraphBreaks(node) {
        const text = normalizeMarkdownBreaks(node.nodeValue || "");
        const paragraphs = text
          .split(/\n{2,}/)
          .map((paragraph) => paragraph.trim())
          .filter(Boolean);

        if (paragraphs.length === 0) {
          node.nodeValue = "";
          return;
        }

        const parent = node.parentElement;
        if (parent && parent.tagName === "P" && parent.childNodes.length === 1) {
          const fragment = document.createDocumentFragment();
          paragraphs.forEach((paragraph) => {
            const p = document.createElement("p");
            appendTextWithLineBreaks(p, paragraph);
            fragment.appendChild(p);
          });
          parent.replaceWith(fragment);
          return;
        }

        const fragment = document.createDocumentFragment();
        paragraphs.forEach((paragraph, index) => {
          if (index > 0) {
            fragment.appendChild(document.createElement("br"));
            fragment.appendChild(document.createElement("br"));
          }
          appendTextWithLineBreaks(fragment, paragraph);
        });
        node.replaceWith(fragment);
      }

      const leakedNodes = leakedTextNodes();
      leakedNodes.forEach(replaceTextNodeWithParagraphBreaks);

      const remainingLeaks = leakedTextNodes();
      document.body.dataset.separatorLeak = remainingLeaks.length > 0 ? "true" : "false";

      if (remainingLeaks.length > 0) {
        console.error("Separador de parágrafo ainda vazou após reparo automático.", remainingLeaks.map((node) => node.nodeValue));
        return false;
      }

      return true;
    }

    function recalculateAndValidateReport() {
      recalculateAxisLayouts();
      validateNoParagraphSeparatorLeak();
    }
    function updateDebugToggleButton() {
      const button = document.getElementById("toggleDebugBoxes");
      if (!button) return;
      button.textContent = ASSETS.showDebugBoxes ? "Debug: ON" : "Debug: OFF";
      button.setAttribute("aria-pressed", String(Boolean(ASSETS.showDebugBoxes)));
    }

    function setupBuilderDebugToggle() {
      const button = document.getElementById("toggleDebugBoxes");
      if (!button) return;
      updateDebugToggleButton();
      button.addEventListener("click", () => {
        ASSETS.showDebugBoxes = !ASSETS.showDebugBoxes;
        document.body.classList.toggle("debug-boxes", Boolean(ASSETS.showDebugBoxes));
        updateDebugToggleButton();
      });
    }

    function setupBuilderPdfExport() {
      const button = document.getElementById("exportPdfButton");
      if (!button) return;
      button.addEventListener("click", () => {
        requestAnimationFrame(() => window.print());
      });
    }
    renderReport();
    setupBuilderDebugToggle();
    setupBuilderPdfExport();
    requestAnimationFrame(() => requestAnimationFrame(recalculateAndValidateReport));
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => requestAnimationFrame(recalculateAndValidateReport));
    }
    window.addEventListener("load", () => requestAnimationFrame(recalculateAndValidateReport));
  </script>
</body>
</html>
